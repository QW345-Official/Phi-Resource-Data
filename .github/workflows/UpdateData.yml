name: Update TapTap Resources

on:
  workflow_dispatch:        # 手动触发

permissions:
  contents: write           # 允许 push 回仓库

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 需要完整历史用于 git 操作

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 运行 taptap.py 并解析 version_code
        id: parse
        run: |
          set -euo pipefail
          OUTPUT=$(python source/taptap.py)
          echo "原始输出: $OUTPUT"

          # 提取 version_code 和 download
          VERSION_CODE=$(echo "$OUTPUT" | python -c "import sys,json; d=json.load(sys.stdin); print(d['data']['apk']['version_code'])")
          DOWNLOAD=$(echo "$OUTPUT"    | python -c "import sys,json; d=json.load(sys.stdin); print(d['data']['apk']['download'])")

          echo "version_code = $VERSION_CODE"
          echo "download     = $DOWNLOAD"

          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "download=$DOWNLOAD"         >> "$GITHUB_OUTPUT"

      - name: 读取已保存的 version_code
        id: saved
        run: |
          if [ -f version.txt ]; then
            SAVED=$(cat version.txt | tr -d '[:space:]')
          else
            SAVED=""
          fi
          echo "已保存: '$SAVED'"
          echo "saved=$SAVED" >> "$GITHUB_OUTPUT"

      - name: 比较版本
        id: cmp
        run: |
          if [ "${{ steps.parse.outputs.version_code }}" != "${{ steps.saved.outputs.saved }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # ---------- 以下仅在版本变化时执行 ----------
      - name: 下载 APK
        if: steps.cmp.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p output
          URL="${{ steps.parse.outputs.download }}"
          echo "下载: $URL"
          curl -L --fail --retry 3 -o "output/${{ steps.parse.outputs.version_code }}.apk" "$URL"
          ls -lh output/

      - name: 运行 gameInformation.py
        if: steps.cmp.outputs.changed == 'true'
        run: python source/gameInformation.py

      - name: 运行 resource.py
        if: steps.cmp.outputs.changed == 'true'
        run: python source/resource.py

      - name: 更新 version.txt
        if: steps.cmp.outputs.changed == 'true'
        run: |
          echo "${{ steps.parse.outputs.version_code }}" > version.txt

      - name: 提交并推送
        if: steps.cmp.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "没有变更，跳过提交"
          else
            git commit -m "chore: update resources for version_code ${{ steps.parse.outputs.version_code }}"
            git push
          fi
