name: Update TapTap Resources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run taptap.py and parse
        id: parse
        run: |
          set -euo pipefail
          OUTPUT=$(python source/taptap.py 2>&1)
          echo "$OUTPUT"

          cat > /tmp/parse_taptap.py <<'PYEOF'
          import sys
          import json

          result = None
          for line in sys.stdin:
              line = line.strip()
              if not line.startswith("{"):
                  continue
              try:
                  obj = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if isinstance(obj, dict) and isinstance(obj.get("data"), dict) and "apk" in obj["data"]:
                  result = obj

          if result is None:
              sys.exit("未找到含 data.apk 的合法 JSON")

          print(json.dumps(result))
          PYEOF

          PARSED=$(printf '%s\n' "$OUTPUT" | python /tmp/parse_taptap.py)

          VERSION_CODE=$(echo "$PARSED" | python -c "import sys,json; print(json.load(sys.stdin)['data']['apk']['version_code'])")
          VERSION_NAME=$(echo "$PARSED" | python -c "import sys,json; print(json.load(sys.stdin)['data']['apk']['version_name'])")
          DOWNLOAD=$(echo "$PARSED" | python -c "import sys,json; print(json.load(sys.stdin)['data']['apk']['download'])")

          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "download=$DOWNLOAD" >> "$GITHUB_OUTPUT"

      - name: Read saved version
        id: saved
        run: |
          if [ -f version.txt ]; then
            SAVED=$(tr -d '[:space:]' < version.txt)
          else
            SAVED=""
          fi
          echo "saved=$SAVED" >> "$GITHUB_OUTPUT"

      - name: Compare version
        id: cmp
        run: |
          if [ "${{ steps.parse.outputs.version_code }}" != "${{ steps.saved.outputs.saved }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download APK
        if: steps.cmp.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p output
          curl -L --fail --retry 3 -o "output/${{ steps.parse.outputs.version_code }}.apk" "${{ steps.parse.outputs.download }}"
          ls -lh output/

      - name: Run gameInformation.py
        if: steps.cmp.outputs.changed == 'true'
        run: python source/gameInformation.py

      - name: Run resource.py
        if: steps.cmp.outputs.changed == 'true'
        run: python source/resource.py

      - name: Update version.txt
        if: steps.cmp.outputs.changed == 'true'
        run: |
          echo "${{ steps.parse.outputs.version_code }}" > version.txt

      - name: Commit and push (exclude APK)
        if: steps.cmp.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          git reset -- 'output/*.apk' || true

          if git diff --cached --quiet; then
            echo "没有需要提交的变更"
          else
            git commit -m "chore: update resources for version_code ${{ steps.parse.outputs.version_code }}"
            git push
          fi

      - name: Zip each resource folder
        if: steps.cmp.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p release-assets

          for dir in */; do
            dir="${dir%/}"
            case "$dir" in
              .git|.github|output|release-assets|source) continue ;;
            esac
            if [ -d "$dir" ] && [ -n "$(ls -A "$dir" 2>/dev/null)" ]; then
              echo "压缩: $dir"
              zip -r "release-assets/Phigros_Resource-${dir}.zip" "$dir"
            fi
          done

          ls -lh release-assets/

      - name: Publish Release
        if: steps.cmp.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.parse.outputs.version_name }}
          name: ${{ steps.parse.outputs.version_name }}
          files: |
            release-assets/*.zip
            output/*.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
