name: Update Resources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvorbis-dev libogg-dev zip
          python -m pip install --upgrade pip
          if [ -f source/requirements.txt ]; then
            pip install -r source/requirements.txt
          else
            echo "source/requirements.txt 不存在，跳过"
          fi

      - name: Run taptap.py and parse
        id: parse
        run: |
          set -euo pipefail
          python source/taptap.py > /tmp/taptap_raw.txt 2>&1 || true
          echo "===== taptap.py 输出 ====="
          cat /tmp/taptap_raw.txt

          python source/parse_taptap.py < /tmp/taptap_raw.txt > /tmp/taptap_parsed.json
          echo "===== 解析结果 ====="
          cat /tmp/taptap_parsed.json

          VERSION_CODE=$(python -c "import json; print(json.load(open('/tmp/taptap_parsed.json'))['data']['apk']['version_code'])")
          VERSION_NAME=$(python -c "import json; print(json.load(open('/tmp/taptap_parsed.json'))['data']['apk']['version_name'])")
          DOWNLOAD=$(python -c "import json; print(json.load(open('/tmp/taptap_parsed.json'))['data']['apk']['download'])")

          echo "version_code=$VERSION_CODE"
          echo "version_name=$VERSION_NAME"
          echo "download=$DOWNLOAD"

          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "download=$DOWNLOAD" >> "$GITHUB_OUTPUT"

      - name: Read saved version
        id: saved
        run: |
          if [ -f version.txt ]; then
            SAVED=$(tr -d '[:space:]' < version.txt)
          else
            SAVED=""
          fi
          echo "saved=$SAVED" >> "$GITHUB_OUTPUT"

      - name: Compare version
        id: cmp
        run: |
          if [ "${{ steps.parse.outputs.version_code }}" != "${{ steps.saved.outputs.saved }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download APK
        if: steps.cmp.outputs.changed == 'true'
        run: |
          set -euo pipefail
          mkdir -p output
          curl -L --fail --retry 3 -o "output/${{ steps.parse.outputs.version_code }}.apk" "${{ steps.parse.outputs.download }}"
          ls -lh output/
          free -h

      - name: Run gameInformation.py
        if: steps.cmp.outputs.changed == 'true'
        working-directory: source
        run: |
          set +e
          python gameInformation.py "../output/${{ steps.parse.outputs.version_code }}.apk"
          CODE=$?
          echo "gameInformation.py 退出码: $CODE"
          free -h
          if [ $CODE -ne 0 ]; then exit $CODE; fi

      - name: Run resource.py
        if: steps.cmp.outputs.changed == 'true'
        working-directory: source
        env:
          LD_PRELOAD: /usr/lib/x86_64-linux-gnu/libvorbisenc.so.2
        run: |
          set +e
          python resource.py "../output/${{ steps.parse.outputs.version_code }}.apk"
          CODE=$?
          echo "resource.py 退出码: $CODE"
          free -h
          if [ $CODE -eq 137 ]; then
            echo "::error::resource.py 被 SIGKILL（退出码 137），极可能是内存不足（OOM）。"
            exit 137
          elif [ $CODE -ne 0 ]; then
            echo "::error::resource.py 失败，退出码 $CODE"
            exit $CODE
          fi

      - name: Move generated folders to repo root
        if: steps.cmp.outputs.changed == 'true'
        run: |
          set -euxo pipefail
          for name in info avatar chart illustration illustrationBlur illustrationLowRes music; do
            if [ -d "source/$name" ]; then
              echo "移动 source/$name -> $name"
              rm -rf "$name"
              mv "source/$name" "$name"
            else
              echo "不存在，跳过: source/$name"
            fi
          done
          echo "===== 根目录内容 ====="
          ls -la

      - name: Update version.txt
        if: steps.cmp.outputs.changed == 'true'
        run: |
          echo "${{ steps.parse.outputs.version_code }}" > version.txt

      # ========== 分批 Commit & Push（核心修复） ==========
      - name: Git config & cleanup
        if: steps.cmp.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 524288000

          # 清理不该提交的文件
          rm -rf source/__pycache__
          git rm -r --cached source/__pycache__ || true

      - name: Commit and push (batch)
        if: steps.cmp.outputs.changed == 'true'
        run: |
          set -euo pipefail

          commit_and_push() {
            local msg="$1"
            shift
            local paths=("$@")

            git add "${paths[@]}"
            if git diff --cached --quiet; then
              echo "没有变更，跳过: $msg"
              return
            fi

            git commit -m "$msg"

            for i in 1 2 3; do
              echo "Push 尝试 $i ..."
              if git push; then
                echo "Push 成功"
                return
              fi
              echo "Push 失败，等待 10s 后重试..."
              sleep 10
            done

            echo "::error::Push 多次失败，终止"
            exit 1
          }

          # 1. info
          if [ -d info ]; then
            commit_and_push "chore: update resources info (${{ steps.parse.outputs.version_code }})" info
          fi

          # 2. avatar
          if [ -d avatar ]; then
            commit_and_push "chore: update resources avatar (${{ steps.parse.outputs.version_code }})" avatar
          fi

          # 3. chart
          if [ -d chart ]; then
            commit_and_push "chore: update resources chart (${{ steps.parse.outputs.version_code }})" chart
          fi

          # 4. illustration 系列
          for d in illustration illustrationBlur illustrationLowRes; do
            if [ -d "$d" ]; then
              commit_and_push "chore: update resources $d (${{ steps.parse.outputs.version_code }})" "$d"
            fi
          done

          # 5. music（最重，单独一批）
          if [ -d music ]; then
            commit_and_push "chore: update resources music (${{ steps.parse.outputs.version_code }})" music
          fi

          # 6. version.txt
          commit_and_push "chore: update version.txt (${{ steps.parse.outputs.version_code }})" version.txt

      - name: Zip each resource folder
        if: steps.cmp.outputs.changed == 'true'
        run: |
          set -euxo pipefail
          mkdir -p release-assets

          for name in info avatar chart illustration illustrationBlur illustrationLowRes music; do
            dir="$name"
            if [ -d "$dir" ] && [ -n "$(ls -A "$dir" 2>/dev/null)" ]; then
              echo "压缩: $dir -> Phigros_Resource-${name}.zip"
              zip -r "release-assets/Phigros_Resource-${name}.zip" "$dir"
            else
              echo "跳过（不存在或为空）: $dir"
            fi
          done

          echo "===== release-assets 内容 ====="
          ls -lh release-assets/

      - name: Publish Release
        if: steps.cmp.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.parse.outputs.version_name }}
          name: ${{ steps.parse.outputs.version_name }}
          files: |
            release-assets/*.zip
            output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
